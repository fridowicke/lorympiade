<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Lorympic Games</title>
    <meta
      name="description"
      content="A suspiciously ceremonial invitation to the Lorympic Games."
    />
    <link rel="icon" href="./favicon.svg" />
    <script>
      (function () {
        var redirect = window.location.search;
        if (redirect[1] === "/") {
          var decoded = redirect
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            window.location.pathname.slice(0, -1) + decoded + window.location.hash,
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
