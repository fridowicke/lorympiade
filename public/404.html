<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lorympic Games</title>
    <script>
      var pathSegmentsToKeep = 1;

      var locationData = window.location;
      var redirectTarget =
        locationData.protocol +
        "//" +
        locationData.hostname +
        (locationData.port ? ":" + locationData.port : "") +
        locationData.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/") +
        "/?/" +
        locationData.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~") +
        (locationData.search ? "&" + locationData.search.slice(1).replace(/&/g, "~and~") : "") +
        locationData.hash;

      location.replace(redirectTarget);
    </script>
  </head>
  <body></body>
</html>
